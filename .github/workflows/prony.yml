name: prony

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [prony-relay]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && (startsWith(github.event.comment.body, '/prony approve') || startsWith(github.event.comment.body, '/prony explain')))
    concurrency:
      group: prony-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      # SANDBOX ONLY: prony lives in a private repo, so check out prony's OWN code
      # (never the PR's code) with a read-only deploy key, then run it as a local action.
      - uses: actions/checkout@v4
        with:
          repository: OmerPony/prony-action
          ref: main
          ssh-key: ${{ secrets.PRONY_ACTION_DEPLOY_KEY }}
          path: .prony-action
          persist-credentials: false
      - uses: ./.prony-action
        with:
          # GITHUB_TOKEN cannot read repository variables via the API, so pass the
          # breaker state in from the vars context.
          breaker-state: ${{ vars.PRONY_BREAKER }}
          breaker-from-vars: "1"
